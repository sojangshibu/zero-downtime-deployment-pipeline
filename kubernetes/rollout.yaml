apiVersion: argoproj.io/v1alpha1
kind: Rollout

metadata:
  name: zero-downtime-app
  namespace: deployment-demo

spec:
  replicas: 3

  selector:
    matchLabels:
      app: zero-downtime-app

  template:
    metadata:
      labels:
        app: zero-downtime-app

    spec:
      containers:
        - name: app
          image: zero-downtime-app:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000

          env:
            - name: APP_VERSION
              value: "v2"

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10

  strategy:
    canary:
      steps:
        - setWeight: 5
        - pause:
            duration: 30s

        - setWeight: 25
        - pause:
            duration: 30s

        - setWeight: 50
        - pause:
            duration: 30s
